name: Déployer TalcoPlayer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le site et injecter les liens secrets
        env:
          PLAYER_2: ${{ secrets.PLAYER_2 }}
          PLAYER_1: ${{ secrets.PLAYER_1 }}
          PLAYER_3: ${{ secrets.PLAYER_3 }}
        run: |
          if [ -z "$PLAYER_1" ] || [ -z "$PLAYER_2" ] || [ -z "$PLAYER_3" ]; then
            echo "Secrets PLAYER_1, PLAYER_2 et PLAYER_3 requis"; exit 1
          fi
          mkdir _site
          rsync -a --exclude='.git*' --exclude='_site' --exclude='README.md' ./ _site/
          esc() { printf '%s' "$1" | sed 's/[&|\\]/\\&/g'; }
          sed -i "s|__PLAYER_2__|$(esc "$PLAYER_2")|; s|__PLAYER_1__|$(esc "$PLAYER_1")|; s|__PLAYER_3__|$(esc "$PLAYER_3")|" _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        
